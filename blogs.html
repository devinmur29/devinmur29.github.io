---
title: Devin's Blogs
pagination:
  data: collections.post
  size: 1000
  alias: posts
---

<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
  <meta charset="utf-8" />
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="../css/style.css" rel="stylesheet">


</head>
<body>
  <div class="container-fluid">
    <div class="sec-wrapper blog-wrapper" id="bloglist">
      <div class="row section-head">
        <div class="col col-wrapper">
          <div class="blog-title">Blogs</div>
        </div>
      </div>

    {% for post in posts%}
        <div class="section-item">
            <div class="col-xs-12 col-md col-wrapper">
                <div class="title">
                    <span>{{ post.data.date | date: "%m-%d-%Y" }}</span> <a href="{{ post.url }}"> - {{ post.data.title }}</a>
                </div> 
                <div class="blog-summary">
                    {{post.data.summary}}
                </div>
            </div>
        </div>
    {% endfor %}
    </div>
  </div>
</body>
</html>
